services:
  - type: web
    name: axil-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: axil-db
          property: connectionString
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: axil-db
    plan: free
